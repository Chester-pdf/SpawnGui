name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create project files
        run: |
          mkdir -p .
          cat > build.gradle <<'SPAWNGUI_EOF'
          plugins {
          	id 'net.fabricmc.fabric-loom'
          	id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
          	archivesName = project.archives_base_name
          }

          repositories {
          	// Loom сам добавляет нужные Maven-репозитории.
          	// Mod Menu — только для компиляции (в jar не попадает, в рантайме он опционален).
          	maven {
          		name = 'TerraformersMC'
          		url = 'https://maven.terraformersmc.com/'
          		content {
          			includeGroup 'com.terraformersmc'
          		}
          		metadataSources {
          			mavenPom()
          			artifact()
          		}
          	}
          }

          dependencies {
          	// 26.x — игра без обфускации, поэтому строки mappings нет.
          	minecraft "com.mojang:minecraft:${project.minecraft_version}"
          	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
          	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
          	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
          }

          processResources {
          	inputs.property "version", project.version

          	filesMatching("fabric.mod.json") {
          		expand "version": project.version
          	}
          }

          tasks.withType(JavaCompile).configureEach {
          	it.options.release = 25
          }

          java {
          	withSourcesJar()
          	sourceCompatibility = JavaVersion.VERSION_25
          	targetCompatibility = JavaVersion.VERSION_25
          }
          SPAWNGUI_EOF
          mkdir -p .
          cat > gradle.properties <<'SPAWNGUI_EOF'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true

          # Fabric: https://fabricmc.net/develop
          minecraft_version=26.2
          loader_version=0.19.5
          loom_version=1.18.4
          fabric_api_version=0.161.0+26.2

          # Mod Menu (опциональная зависимость, нужна только для сборки)
          modmenu_version=20.0.3

          # Mod
          mod_version=1.2.0
          maven_group=com.example.spawngui
          archives_base_name=spawngui
          SPAWNGUI_EOF
          mkdir -p .
          cat > settings.gradle <<'SPAWNGUI_EOF'
          pluginManagement {
          	repositories {
          		maven {
          			name = 'Fabric'
          			url = 'https://maven.fabricmc.net/'
          		}
          		mavenCentral()
          		gradlePluginPortal()
          	}
          	plugins {
          		id 'net.fabricmc.fabric-loom' version providers.gradleProperty('loom_version').get()
          	}
          }

          rootProject.name = 'spawngui'
          SPAWNGUI_EOF
          mkdir -p src/main/resources
          cat > src/main/resources/fabric.mod.json <<'SPAWNGUI_EOF'
          {
            "schemaVersion": 1,
            "id": "spawngui",
            "version": "${version}",
            "name": "Spawn GUI",
            "description": "Меню спавна мобов с большим числом параметров и редактор характеристик существ (Shift + взгляд на моба + клавиша меню).",
            "authors": ["You"],
            "license": "MIT",
            "environment": "client",
            "entrypoints": {
              "client": ["com.example.spawngui.client.SpawnGuiClient"],
              "modmenu": ["com.example.spawngui.client.SpawnGuiModMenu"]
            },
            "depends": {
              "fabricloader": ">=0.19.2",
              "minecraft": "~26.2",
              "java": ">=25",
              "fabric-api": "*"
            },
            "suggests": {
              "modmenu": "*"
            }
          }
          SPAWNGUI_EOF
          mkdir -p src/main/resources/assets/spawngui/lang
          cat > src/main/resources/assets/spawngui/lang/en_us.json <<'SPAWNGUI_EOF'
          {
            "key.spawngui.open": "Open spawn menu (sneak + look at a mob: edit it)",
            "key.spawngui.remove": "Remove spawned mob you are looking at",
            "key.category.spawngui.main": "Spawn GUI"
          }
          SPAWNGUI_EOF
          mkdir -p src/main/resources/assets/spawngui/lang
          cat > src/main/resources/assets/spawngui/lang/ru_ru.json <<'SPAWNGUI_EOF'
          {
            "key.spawngui.open": "Открыть меню спавна (с Shift на моба — редактор)",
            "key.spawngui.remove": "Убрать заспавненного моба, на которого смотришь",
            "key.category.spawngui.main": "Spawn GUI"
          }
          SPAWNGUI_EOF
          mkdir -p src/main/java/com/example/spawngui/client
          cat > src/main/java/com/example/spawngui/client/SpawnGuiModMenu.java <<'SPAWNGUI_EOF'
          package com.example.spawngui.client;

          import com.terraformersmc.modmenu.api.ConfigScreenFactory;
          import com.terraformersmc.modmenu.api.ModMenuApi;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.gui.screens.options.controls.KeyBindsScreen;

          /**
           * Кнопка настроек мода в Mod Menu: открывает стандартный экран назначения клавиш,
           * где в категории «Spawn GUI» можно переназначить клавишу открытия меню.
           */
          public class SpawnGuiModMenu implements ModMenuApi {
          	@Override
          	public ConfigScreenFactory<?> getModConfigScreenFactory() {
          		return parent -> new KeyBindsScreen(parent, Minecraft.getInstance().options);
          	}
          }
          SPAWNGUI_EOF
          mkdir -p src/main/java/com/example/spawngui/client
          cat > src/main/java/com/example/spawngui/client/SpawnGuiClient.java <<'SPAWNGUI_EOF'
          package com.example.spawngui.client;

          import com.mojang.blaze3d.platform.InputConstants;
          import java.util.ArrayDeque;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keymapping.v1.KeyMappingHelper;
          import net.minecraft.client.KeyMapping;
          import net.minecraft.client.Minecraft;
          import net.minecraft.resources.Identifier;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.player.Player;
          import org.lwjgl.glfw.GLFW;

          public class SpawnGuiClient implements ClientModInitializer {
          	public static final String MOD_ID = "spawngui";

          	/** Как далеко можно навестись на существо, чтобы открыть редактор. */
          	private static final double EDIT_RANGE = 32.0;

          	/** Команды на отправку (запасной путь для мультиплеера). Шлём по несколько за тик. */
          	private static final ArrayDeque<String> PENDING = new ArrayDeque<>();
          	private static final int COMMANDS_PER_TICK = 5;

          	private static KeyMapping openKey;
          	private static KeyMapping removeKey;

          	public static void queue(String command) {
          		PENDING.add(command);
          	}

          	/**
          	 * Клавиша меню: присев (Shift) и глядя на существо — открывает редактор его характеристик,
          	 * иначе открывает меню спавна.
          	 */
          	private static void openMenu(Minecraft client) {
          		if (client.player.isShiftKeyDown()) {
          			Entity target = Look.find(client.player, EDIT_RANGE,
          					e -> e.isAlive() && e.isPickable() && !(e instanceof Player));
          			if (target != null) {
          				client.gui.setScreen(new EditScreen(target));
          				return;
          			}
          		}
          		client.gui.setScreen(new SpawnScreen());
          	}

          	@Override
          	public void onInitializeClient() {
          		KeyMapping.Category category = KeyMapping.Category.register(
          				Identifier.fromNamespaceAndPath(MOD_ID, "main"));

          		openKey = KeyMappingHelper.registerKeyMapping(new KeyMapping(
          				"key.spawngui.open",
          				InputConstants.Type.KEYSYM,
          				GLFW.GLFW_KEY_K,
          				category));

          		removeKey = KeyMappingHelper.registerKeyMapping(new KeyMapping(
          				"key.spawngui.remove",
          				InputConstants.Type.KEYSYM,
          				GLFW.GLFW_KEY_X,
          				category));

          		ClientTickEvents.END_CLIENT_TICK.register(client -> {
          			if (client.player == null) {
          				PENDING.clear();
          				return;
          			}

          			while (openKey.consumeClick()) {
          				if (client.gui.screen() == null) {
          					openMenu(client);
          				}
          			}

          			while (removeKey.consumeClick()) {
          				if (client.gui.screen() == null) {
          					SpawnScreen.removeLookedAt(client);
          				}
          			}

          			for (int i = 0; i < COMMANDS_PER_TICK && !PENDING.isEmpty(); i++) {
          				client.player.connection.sendCommand(PENDING.poll());
          			}
          		});
          	}
          }
          SPAWNGUI_EOF
          mkdir -p src/main/java/com/example/spawngui/client
          cat > src/main/java/com/example/spawngui/client/Props.java <<'SPAWNGUI_EOF'
          package com.example.spawngui.client;

          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;
          import net.minecraft.core.Holder;
          import net.minecraft.core.registries.BuiltInRegistries;
          import net.minecraft.network.chat.Component;
          import net.minecraft.resources.Identifier;
          import net.minecraft.world.effect.MobEffectInstance;
          import net.minecraft.world.effect.MobEffects;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.EquipmentSlot;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.entity.Mob;
          import net.minecraft.world.entity.ai.attributes.Attribute;
          import net.minecraft.world.entity.ai.attributes.AttributeInstance;
          import net.minecraft.world.entity.ai.attributes.AttributeModifier;
          import net.minecraft.world.entity.ai.attributes.Attributes;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.item.Items;

          /**
           * Все настраиваемые параметры моба в одном месте. Используется и меню спавна, и редактором
           * (Shift + взгляд на моба + клавиша меню): применение к мобу, чтение из моба, сборка NBT для команд.
           */
          final class Props {

          	enum Mode { PREVIEW, SPAWN, EDIT }

          	/** Метка, которой помечаются все мобы, созданные модом (для клавиши удаления). */
          	static final String TAG = "spawngui";

          	/** Значение «не трогать / как у моба по умолчанию». */
          	static final double AUTO = -1.0;

          	private static final Identifier SPEED_ID = Identifier.fromNamespaceAndPath("spawngui", "speed");

          	// Наборы значений для кнопок-переключателей в меню спавна.
          	static final double[] HP = {AUTO, 1, 10, 50, 100, 500, 1024};
          	static final double[] SCALE = {0.25, 0.5, 1.0, 2.0, 3.0, 5.0, 10.0};
          	static final double[] SPEED = {0.25, 0.5, 1.0, 1.5, 2.0, 3.0, 5.0};
          	static final double[] DAMAGE = {AUTO, 1, 4, 10, 50, 200, 1000};
          	static final double[] ARMOR = {AUTO, 0, 5, 10, 20, 30};
          	static final double[] KNOCKBACK = {AUTO, 0, 0.5, 1.0};

          	static final String[] GEAR_NAMES = {"авто", "кожа", "кольч.", "железо", "золото", "алмаз", "незер.", "снять"};
          	static final String[] WEAPON_NAMES = {"авто", "ничего", "жел. меч", "алм. меч", "нез. меч", "лук", "арбалет", "трезубец"};
          	static final String[] EFFECT_NAMES = {"авто", "скор. II", "сила II", "сопрот. II", "регенер. II", "огнестойк.", "прыжок II", "пёрышко", "снять все"};

          	private static final String[] EFFECT_IDS = {null, "speed", "strength", "resistance", "regeneration", "fire_resistance", "jump_boost", "slow_falling"};
          	private static final int[] EFFECT_AMP = {0, 1, 1, 1, 1, 0, 1, 0};

          	private static final EquipmentSlot[] ARMOR_SLOTS = {EquipmentSlot.HEAD, EquipmentSlot.CHEST, EquipmentSlot.LEGS, EquipmentSlot.FEET};
          	private static final String[] ARMOR_SLOT_KEYS = {"head", "chest", "legs", "feet"};

          	// --- значения ---
          	String name = "";
          	boolean nameVisible = true;
          	double hp = AUTO;
          	double scale = 1.0;
          	double speed = 1.0;
          	double damage = AUTO;
          	double armor = AUTO;
          	double knockback = AUTO;
          	boolean baby;
          	boolean noAi;
          	boolean silent;
          	boolean invulnerable;
          	boolean glowing;
          	boolean persistent;
          	boolean invisible;
          	boolean noGravity;
          	boolean onFire;
          	int gear;
          	int weapon;
          	int effect;

          	Props copy() {
          		Props p = new Props();
          		p.copyFrom(this);
          		return p;
          	}

          	void copyFrom(Props o) {
          		name = o.name;
          		nameVisible = o.nameVisible;
          		hp = o.hp;
          		scale = o.scale;
          		speed = o.speed;
          		damage = o.damage;
          		armor = o.armor;
          		knockback = o.knockback;
          		baby = o.baby;
          		noAi = o.noAi;
          		silent = o.silent;
          		invulnerable = o.invulnerable;
          		glowing = o.glowing;
          		persistent = o.persistent;
          		invisible = o.invisible;
          		noGravity = o.noGravity;
          		onFire = o.onFire;
          		gear = o.gear;
          		weapon = o.weapon;
          		effect = o.effect;
          	}

          	/** Следующее значение из набора, большее текущего (по кругу). Работает и для «чужих» значений. */
          	static double next(double[] values, double current) {
          		for (double v : values) {
          			if (v > current + 1e-9) {
          				return v;
          			}
          		}
          		return values[0];
          	}

          	// ------------------------------------------------------------ чтение из моба

          	/** Читает текущие характеристики существующей сущности (для редактора). */
          	static Props from(Entity e) {
          		Props p = new Props();
          		Component custom = e.getCustomName();
          		p.name = custom == null ? "" : custom.getString();
          		p.nameVisible = e.isCustomNameVisible();
          		p.silent = e.isSilent();
          		p.invulnerable = e.isInvulnerable();
          		p.glowing = e.hasGlowingTag();
          		p.invisible = e.isInvisible();
          		p.noGravity = e.isNoGravity();
          		p.onFire = e.isOnFire();

          		if (e instanceof Mob mob) {
          			p.noAi = mob.isNoAi();
          			p.baby = mob.isBaby();
          			p.persistent = mob.isPersistenceRequired();
          		}

          		if (e instanceof LivingEntity living) {
          			p.hp = living.getMaxHealth();
          			AttributeInstance a = living.getAttribute(Attributes.SCALE);
          			if (a != null) {
          				p.scale = a.getBaseValue();
          			}
          			a = living.getAttribute(Attributes.MOVEMENT_SPEED);
          			if (a != null) {
          				AttributeModifier m = a.getModifier(SPEED_ID);
          				p.speed = m == null ? 1.0 : 1.0 + m.amount();
          			}
          			a = living.getAttribute(Attributes.ATTACK_DAMAGE);
          			p.damage = a == null ? AUTO : a.getBaseValue();
          			a = living.getAttribute(Attributes.ARMOR);
          			p.armor = a == null ? AUTO : a.getBaseValue();
          			a = living.getAttribute(Attributes.KNOCKBACK_RESISTANCE);
          			p.knockback = a == null ? AUTO : a.getBaseValue();
          		}
          		return p;
          	}

          	// ------------------------------------------------------------ применение

          	private static void setBase(LivingEntity e, Holder<Attribute> attribute, double value) {
          		AttributeInstance inst = e.getAttribute(attribute);
          		if (inst != null) {
          			inst.setBaseValue(value);
          		}
          	}

          	private static Item[] gearItems(int gear) {
          		return switch (gear) {
          			case 1 -> new Item[] {Items.LEATHER_HELMET, Items.LEATHER_CHESTPLATE, Items.LEATHER_LEGGINGS, Items.LEATHER_BOOTS};
          			case 2 -> new Item[] {Items.CHAINMAIL_HELMET, Items.CHAINMAIL_CHESTPLATE, Items.CHAINMAIL_LEGGINGS, Items.CHAINMAIL_BOOTS};
          			case 3 -> new Item[] {Items.IRON_HELMET, Items.IRON_CHESTPLATE, Items.IRON_LEGGINGS, Items.IRON_BOOTS};
          			case 4 -> new Item[] {Items.GOLDEN_HELMET, Items.GOLDEN_CHESTPLATE, Items.GOLDEN_LEGGINGS, Items.GOLDEN_BOOTS};
          			case 5 -> new Item[] {Items.DIAMOND_HELMET, Items.DIAMOND_CHESTPLATE, Items.DIAMOND_LEGGINGS, Items.DIAMOND_BOOTS};
          			case 6 -> new Item[] {Items.NETHERITE_HELMET, Items.NETHERITE_CHESTPLATE, Items.NETHERITE_LEGGINGS, Items.NETHERITE_BOOTS};
          			default -> null;
          		};
          	}

          	private static Item weaponItem(int weapon) {
          		return switch (weapon) {
          			case 1 -> Items.AIR;
          			case 2 -> Items.IRON_SWORD;
          			case 3 -> Items.DIAMOND_SWORD;
          			case 4 -> Items.NETHERITE_SWORD;
          			case 5 -> Items.BOW;
          			case 6 -> Items.CROSSBOW;
          			case 7 -> Items.TRIDENT;
          			default -> null;
          		};
          	}

          	private static MobEffectInstance effectOf(int idx) {
          		int inf = MobEffectInstance.INFINITE_DURATION;
          		return switch (idx) {
          			case 1 -> new MobEffectInstance(MobEffects.SPEED, inf, 1);
          			case 2 -> new MobEffectInstance(MobEffects.STRENGTH, inf, 1);
          			case 3 -> new MobEffectInstance(MobEffects.RESISTANCE, inf, 1);
          			case 4 -> new MobEffectInstance(MobEffects.REGENERATION, inf, 1);
          			case 5 -> new MobEffectInstance(MobEffects.FIRE_RESISTANCE, inf, 0);
          			case 6 -> new MobEffectInstance(MobEffects.JUMP_BOOST, inf, 1);
          			case 7 -> new MobEffectInstance(MobEffects.SLOW_FALLING, inf, 0);
          			default -> null;
          		};
          	}

          	/**
          	 * Применяет параметры к мобу: для превью (только внешний вид), для нового моба (SPAWN)
          	 * или для уже существующего (EDIT).
          	 */
          	void apply(Entity entity, Mode mode) {
          		if (mode == Mode.SPAWN) {
          			entity.addTag(TAG);
          		}

          		if (mode != Mode.PREVIEW) {
          			String n = name.trim();
          			Component current = entity.getCustomName();
          			if (!n.isEmpty()) {
          				if (current == null || !current.getString().equals(n)) {
          					entity.setCustomName(Component.literal(n));
          				}
          				entity.setCustomNameVisible(nameVisible);
          			} else if (mode == Mode.EDIT && current != null) {
          				entity.setCustomName(null);
          				entity.setCustomNameVisible(false);
          			}

          			if (onFire) {
          				entity.setRemainingFireTicks(20 * 600);
          			} else if (mode == Mode.EDIT && entity.isOnFire()) {
          				entity.clearFire();
          			}
          		}

          		entity.setSilent(silent);
          		entity.setInvulnerable(invulnerable);
          		entity.setGlowingTag(glowing);
          		entity.setInvisible(invisible);
          		entity.setNoGravity(noGravity);

          		if (entity instanceof Mob mob) {
          			mob.setNoAi(noAi);
          			if (mob.isBaby() != baby) {
          				mob.setBaby(baby);
          			}
          			// У Mob нет публичного способа снять «не исчезает», поэтому только включаем.
          			if (persistent) {
          				mob.setPersistenceRequired();
          			}
          		}

          		if (entity instanceof LivingEntity living) {
          			setBase(living, Attributes.SCALE, scale);

          			if (hp > 0) {
          				double oldMax = living.getMaxHealth();
          				setBase(living, Attributes.MAX_HEALTH, hp);
          				// При редактировании не лечим моба, если максимум не менялся.
          				if (mode != Mode.EDIT || Math.abs(oldMax - hp) > 1e-6) {
          					living.setHealth((float) hp);
          				}
          			}
          			if (damage >= 0) {
          				setBase(living, Attributes.ATTACK_DAMAGE, damage);
          			}
          			if (armor >= 0) {
          				setBase(living, Attributes.ARMOR, armor);
          			}
          			if (knockback >= 0) {
          				setBase(living, Attributes.KNOCKBACK_RESISTANCE, knockback);
          			}

          			if (mode != Mode.PREVIEW) {
          				AttributeInstance sp = living.getAttribute(Attributes.MOVEMENT_SPEED);
          				if (sp != null) {
          					sp.removeModifier(SPEED_ID);
          					if (Math.abs(speed - 1.0) > 1e-6) {
          						sp.addPermanentModifier(new AttributeModifier(SPEED_ID, Math.max(0.0, speed) - 1.0,
          								AttributeModifier.Operation.ADD_MULTIPLIED_TOTAL));
          					}
          				}

          				if (effect == 8) {
          					living.removeAllEffects();
          				} else {
          					MobEffectInstance inst = effectOf(effect);
          					if (inst != null) {
          						living.addEffect(inst);
          					}
          				}
          			}

          			Item[] set = gearItems(gear);
          			if (gear == 7) {
          				for (EquipmentSlot slot : ARMOR_SLOTS) {
          					living.setItemSlot(slot, ItemStack.EMPTY);
          				}
          			} else if (set != null) {
          				for (int i = 0; i < ARMOR_SLOTS.length; i++) {
          					living.setItemSlot(ARMOR_SLOTS[i], new ItemStack(set[i]));
          				}
          			}
          			Item hand = weaponItem(weapon);
          			if (hand != null) {
          				living.setItemSlot(EquipmentSlot.MAINHAND, new ItemStack(hand));
          			}
          		}

          		entity.refreshDimensions();
          	}

          	// ------------------------------------------------------------ NBT для команд (чужие серверы)

          	private static String num(double v) {
          		return String.format(Locale.ROOT, "%.4f", v);
          	}

          	private static String itemId(Item item) {
          		return BuiltInRegistries.ITEM.getKey(item).toString();
          	}

          	private static void flag(List<String> out, String key, boolean value, boolean spawn) {
          		if (value || !spawn) {
          			out.add(key + ":" + (value ? "1b" : "0b"));
          		}
          	}

          	private static String attr(String id, double base) {
          		return "{id:\"minecraft:" + id + "\",base:" + num(base) + "d}";
          	}

          	/**
          	 * Собирает NBT для /summon (spawn = true) или /data merge entity (spawn = false).
          	 * Скорость тут не поддерживается — для неё нужен базовый параметр конкретного моба.
          	 */
          	String toNbt(boolean spawn) {
          		List<String> t = new ArrayList<>();
          		if (spawn) {
          			t.add("Tags:[\"" + TAG + "\"]");
          		}
          		flag(t, "NoAI", noAi, spawn);
          		flag(t, "Silent", silent, spawn);
          		flag(t, "Invulnerable", invulnerable, spawn);
          		flag(t, "Glowing", glowing, spawn);
          		flag(t, "Invisible", invisible, spawn);
          		flag(t, "NoGravity", noGravity, spawn);
          		flag(t, "PersistenceRequired", persistent, spawn);

          		if (baby) {
          			t.add("IsBaby:1b");
          			t.add("Age:-24000");
          		} else if (!spawn) {
          			t.add("IsBaby:0b");
          			t.add("Age:0");
          		}

          		if (onFire) {
          			t.add("Fire:32000s");
          		} else if (!spawn) {
          			t.add("Fire:-1s");
          		}

          		String n = name.trim();
          		if (!n.isEmpty()) {
          			t.add("CustomName:\"" + n.replace("\\", "\\\\").replace("\"", "\\\"") + "\"");
          			t.add("CustomNameVisible:" + (nameVisible ? "1b" : "0b"));
          		}

          		List<String> attrs = new ArrayList<>();
          		if (hp > 0) {
          			attrs.add(attr("max_health", hp));
          			if (spawn) {
          				t.add("Health:" + num(hp) + "f");
          			}
          		}
          		if (!spawn || scale != 1.0) {
          			attrs.add(attr("scale", scale));
          		}
          		if (damage >= 0) {
          			attrs.add(attr("attack_damage", damage));
          		}
          		if (armor >= 0) {
          			attrs.add(attr("armor", armor));
          		}
          		if (knockback >= 0) {
          			attrs.add(attr("knockback_resistance", knockback));
          		}
          		if (!attrs.isEmpty()) {
          			t.add("attributes:[" + String.join(",", attrs) + "]");
          		}

          		List<String> equipment = new ArrayList<>();
          		Item[] set = gearItems(gear);
          		if (set != null) {
          			for (int i = 0; i < ARMOR_SLOT_KEYS.length; i++) {
          				equipment.add(ARMOR_SLOT_KEYS[i] + ":{id:\"" + itemId(set[i]) + "\",count:1}");
          			}
          		}
          		Item hand = weaponItem(weapon);
          		if (hand != null && hand != Items.AIR) {
          			equipment.add("mainhand:{id:\"" + itemId(hand) + "\",count:1}");
          		}
          		if (!equipment.isEmpty()) {
          			t.add("equipment:{" + String.join(",", equipment) + "}");
          		}

          		if (effect == 8) {
          			t.add("active_effects:[]");
          		} else if (effect >= 1 && effect <= 7) {
          			t.add("active_effects:[{id:\"minecraft:" + EFFECT_IDS[effect] + "\",amplifier:" + EFFECT_AMP[effect]
          					+ "b,duration:-1,show_particles:0b}]");
          		}

          		return "{" + String.join(",", t) + "}";
          	}
          }
