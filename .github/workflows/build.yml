          cat > src/main/java/com/example/spawngui/client/PropsScreen.java <<'SPAWNGUI_EOF'
          package com.example.spawngui.client;

          import java.util.function.BooleanSupplier;
          import java.util.function.Consumer;
          import java.util.function.Supplier;
          import net.minecraft.client.gui.GuiGraphicsExtractor;
          import net.minecraft.client.gui.components.Button;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.client.gui.screens.inventory.InventoryScreen;
          import net.minecraft.network.chat.Component;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.EntitySpawnReason;
          import net.minecraft.world.entity.EntityType;
          import net.minecraft.world.entity.LivingEntity;

          /**
           * Общая основа для меню спавна и редактора: панель с моделькой, кнопки-переключатели
           * и пересборка превью при любом изменении параметров.
           */
          abstract class PropsScreen extends Screen {

          	/** ID для превью-моба: в мир он не попадает, поэтому коллизий нет. */
          	private static final int PREVIEW_ENTITY_ID = 0x7FFFFF00;

          	protected final Props props;
          	protected LivingEntity preview;
          	/** Размер моба без модификаторов — от него считается масштаб показа. */
          	protected float previewBase = 1.0f;
          	protected Button modelLabel;

          	protected int modelX;
          	protected int modelY;
          	protected int modelW;
          	protected int modelH;

          	protected PropsScreen(Component title, Props props) {
          		super(title);
          		this.props = props;
          	}

          	/** Тип моба для превью (null — превью не показывается). */
          	protected abstract EntityType<?> previewType();

          	/** Подпись под моделькой. */
          	protected abstract String previewLabel();

          	/** Хук: подготовить превью до применения параметров (например, скопировать экипировку). */
          	protected void prepare(LivingEntity living) {}

          	// ------------------------------------------------------------ вспомогательное

          	static String fmt(double v) {
          		return v == Math.floor(v) ? String.valueOf((long) v) : String.valueOf(Math.round(v * 100.0) / 100.0);
          	}

          	protected final Button addLabel(int x, int y, int w, int h, String text) {
          		Button b = Button.builder(Component.literal(text), btn -> {}).bounds(x, y, w, h).build();
          		b.active = false;
          		return this.addRenderableWidget(b);
          	}

          	protected final Button addCycle(int x, int y, int w, Supplier<String> label, Runnable step) {
          		return this.addRenderableWidget(Button.builder(Component.literal(label.get()), b -> {
          			step.run();
          			b.setMessage(Component.literal(label.get()));
          			updatePreview();
          		}).bounds(x, y, w, 20).build());
          	}

          	protected final Button addToggle(int x, int y, int w, String name, BooleanSupplier get, Consumer<Boolean> set) {
          		return this.addRenderableWidget(Button.builder(toggleText(name, get.getAsBoolean()), b -> {
          			set.accept(!get.getAsBoolean());
          			b.setMessage(toggleText(name, get.getAsBoolean()));
          			updatePreview();
          		}).bounds(x, y, w, 20).build());
          	}

          	private static Component toggleText(String name, boolean on) {
          		return Component.literal(name + ": " + (on ? "да" : "нет"));
          	}

          	// ------------------------------------------------------------ превью

          	protected final void refreshLabel() {
          		if (modelLabel != null) {
          			modelLabel.setMessage(Component.literal(previewLabel()));
          		}
          	}

          	/** Пересоздаёт моделька-превью с текущими настройками и обновляет подпись. */
          	protected final void updatePreview() {
          		makePreview();
          		refreshLabel();
          	}

          	/** Создаёт клиентскую копию моба только для показа модельки (в мир она не добавляется). */
          	private void makePreview() {
          		preview = null;
          		EntityType<?> type = previewType();
          		if (type == null || this.minecraft == null || this.minecraft.level == null) {
          			return;
          		}
          		try {
          			Entity entity = type.create(this.minecraft.level, EntitySpawnReason.LOAD);
          			if (entity instanceof LivingEntity living) {
          				// Моб вне мира не имеет ID, а рендерер его требует — выдаём фиктивный.
          				living.setId(PREVIEW_ENTITY_ID);
          				previewBase = Math.max(living.getBbHeight(), living.getBbWidth() * 0.9f);
          				prepare(living);
          				props.apply(living, Props.Mode.PREVIEW);
          				preview = living;
          			}
          		} catch (Throwable ex) {
          			preview = null;
          		}
          	}

          	/** Тёмная панель под моделькой (с рамкой, если включено свечение). */
          	protected final void drawModelPanel(GuiGraphicsExtractor graphics) {
          		graphics.fill(modelX, modelY, modelX + modelW, modelY + modelH, 0xCC101010);
          		if (props.glowing) {
          			int c = 0xFFFFFF99;
          			graphics.fill(modelX, modelY, modelX + modelW, modelY + 1, c);
          			graphics.fill(modelX, modelY + modelH - 1, modelX + modelW, modelY + modelH, c);
          			graphics.fill(modelX, modelY, modelX + 1, modelY + modelH, c);
          			graphics.fill(modelX + modelW - 1, modelY, modelX + modelW, modelY + modelH, c);
          		}
          	}

          	/**
          	 * Моделька следит за курсором, как в инвентаре. Видимый размер растёт вместе с параметром «Размер»
          	 * (логарифмически, чтобы x10 ещё влезал в панель). Сам моб уже масштабируется атрибутом,
          	 * поэтому делим на масштаб.
          	 */
          	protected final void drawModel(GuiGraphicsExtractor graphics, int mouseX, int mouseY) {
          		if (preview == null) {
          			return;
          		}
          		try {
          			double s = Math.max(0.0625, props.scale);
          			double t = Math.log(s / Props.SCALE[0]) / Math.log(Props.SCALE[Props.SCALE.length - 1] / Props.SCALE[0]);
          			t = Math.max(0.0, Math.min(1.0, t));
          			double fill = 0.30 + 0.45 * t;
          			int scale = (int) Math.max(2.0, Math.min(200.0, modelH * fill / (previewBase * s)));
          			InventoryScreen.extractEntityInInventoryFollowsMouse(graphics,
          					modelX, modelY, modelX + modelW, modelY + modelH,
          					scale, 0.0625f, (float) mouseX, (float) mouseY, preview);
          		} catch (Throwable ex) {
          			// Некоторые мобы не умеют рисоваться вне мира — просто прячем превью.
          			preview = null;
          		}
          	}
          }
