          package com.example.spawngui.client;

          import java.util.ArrayList;
          import java.util.Comparator;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Random;
          import java.util.UUID;
          import net.minecraft.ChatFormatting;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.gui.GuiGraphicsExtractor;
          import net.minecraft.client.gui.components.Button;
          import net.minecraft.client.gui.components.EditBox;
          import net.minecraft.core.registries.BuiltInRegistries;
          import net.minecraft.network.chat.Component;
          import net.minecraft.server.MinecraftServer;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.server.level.ServerPlayer;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.EntitySpawnReason;
          import net.minecraft.world.entity.EntityType;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.entity.Mob;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.item.ItemStack;
          import net.minecraft.world.item.Items;
          import net.minecraft.world.level.Level;

          /**
           * Меню спавна: слева — модель выбранного моба, в середине — список (яйца спавна + мобы без яиц:
           * големы, дракон, визер, гигант, стойка для брони...) с поиском, справа — параметры в двух страницах.
           *
           * В одиночной игре (и на LAN-хосте) мобы создаются напрямую на встроенном сервере — права оператора
           * не нужны. На чужом сервере используется /summon (там права оператора нужны всегда).
           */
          public class SpawnScreen extends PropsScreen {

          	private record MobEntry(String id, EntityType<?> type, ItemStack icon, String label, String search) {}

          	private static final double REMOVE_RANGE = 64.0;

          	private static final int ROWS = 9;
          	/** Верхний предел количества за один раз (больше — игра надолго зависнет). */
          	private static final int MAX_COUNT = 1000;

          	private static List<MobEntry> entries;

          	// Настройки запоминаются между открытиями меню.
          	private static final Props PROPS = new Props();
          	private static String selectedId;
          	private static String filter = "";
          	private static int page;
          	private static int spawnCount = 1;
          	private static int paramPage;

          	private final List<Button> listButtons = new ArrayList<>();
          	private final List<MobEntry> listShown = new ArrayList<>();
          	private Button pageLabel;

          	private int listX;
          	private int listW;
          	private int listTop;

          	public SpawnScreen() {
          		super(Component.literal("Спавн мобов"), PROPS);
          	}

          	// ------------------------------------------------------------ данные

          	private static Item specialIcon(String id) {
          		return switch (id) {
          			case "minecraft:iron_golem" -> Items.IRON_BLOCK;
          			case "minecraft:snow_golem" -> Items.CARVED_PUMPKIN;
          			case "minecraft:ender_dragon" -> Items.DRAGON_HEAD;
          			case "minecraft:wither" -> Items.WITHER_SKELETON_SKULL;
          			case "minecraft:giant" -> Items.ZOMBIE_HEAD;
          			default -> null;
          		};
          	}

          	private static boolean isLiving(EntityType<?> type, Level level) {
          		try {
          			return type.create(level, EntitySpawnReason.LOAD) instanceof LivingEntity;
          		} catch (Throwable ex) {
          			return false;
          		}
          	}

          	/**
          	 * Все мобы: те, у кого есть яйцо спавна, и те, у кого его нет, но их можно призвать
          	 * (големы, дракон, визер, гигант, иллюзионист, стойка для брони и т.д.). Собирается один раз.
          	 */
          	private static List<MobEntry> entries() {
          		if (entries != null) {
          			return entries;
          		}

          		Minecraft mc = Minecraft.getInstance();
          		boolean complete = mc.level != null;

          		Map<String, Item> eggs = new HashMap<>();
          		Map<String, Item> items = new HashMap<>();
          		for (Item item : BuiltInRegistries.ITEM) {
          			var key = BuiltInRegistries.ITEM.getKey(item);
          			items.put(key.toString(), item);
          			String path = key.getPath();
          			if (path.endsWith("_spawn_egg")) {
          				eggs.put(key.getNamespace() + ":" + path.substring(0, path.length() - "_spawn_egg".length()), item);
          			}
          		}

          		List<MobEntry> list = new ArrayList<>();
          		for (EntityType<?> type : BuiltInRegistries.ENTITY_TYPE) {
          			String id = BuiltInRegistries.ENTITY_TYPE.getKey(type).toString();
          			Item icon = eggs.get(id);
          			if (icon == null) {
          				// Без яйца: берём только живых существ, которые умеют призываться.
          				if (!complete || !type.canSummon() || !isLiving(type, mc.level)) {
          					continue;
          				}
          				icon = specialIcon(id);
          				if (icon == null) {
          					icon = items.get(id);
          				}
          				if (icon == null) {
          					icon = Items.NAME_TAG;
          				}
          			}
          			String label = type.getDescription().getString();
          			list.add(new MobEntry(id, type, new ItemStack(icon), label, (label + " " + id).toLowerCase(Locale.ROOT)));
          		}

          		list.sort(Comparator.comparing(MobEntry::label, String.CASE_INSENSITIVE_ORDER));
          		if (complete) {
          			entries = list;
          		}
          		return list;
          	}

          	private static MobEntry find(String id) {
          		for (MobEntry e : entries()) {
          			if (e.id().equals(id)) {
          				return e;
          			}
          		}
          		return null;
          	}

          	private MobEntry current() {
          		return find(selectedId);
          	}

          	private static List<MobEntry> filtered() {
          		String q = filter.trim().toLowerCase(Locale.ROOT);
          		if (q.isEmpty()) {
          			return entries();
          		}
          		List<MobEntry> out = new ArrayList<>();
          		for (MobEntry e : entries()) {
          			if (e.search().contains(q)) {
          				out.add(e);
          			}
          		}
          		return out;
          	}

          	@Override
          	protected EntityType<?> previewType() {
          		MobEntry e = current();
          		return e == null ? null : e.type();
          	}

          	@Override
          	protected String previewLabel() {
          		MobEntry e = current();
          		if (e == null) {
          			return "-";
          		}
          		String text = props.name.trim().isEmpty() ? e.label() : props.name.trim();
          		if (props.scale != 1.0) {
          			text += " x" + fmt(props.scale);
          		}
          		return text;
          	}

          	// ------------------------------------------------------------ интерфейс

          	@Override
          	protected void init() {
          		List<MobEntry> all = entries();
          		if (find(selectedId) == null) {
          			MobEntry zombie = find("minecraft:zombie");
          			selectedId = zombie != null ? zombie.id() : (all.isEmpty() ? null : all.get(0).id());
          		}

          		listButtons.clear();
          		listShown.clear();

          		// Раскладка: [модель] [список] [параметры]
          		int total = Math.min(this.width - 16, 480);
          		int left = (this.width - total) / 2;
          		int gap = 6;
          		modelW = total * 26 / 100;
          		listW = total * 32 / 100;
          		int paramW = total - modelW - listW - gap * 2;
          		modelX = left;
          		listX = modelX + modelW + gap;
          		int paramX = listX + listW + gap;

          		int titleY = Math.max(2, (this.height - 244) / 2);
          		int top = titleY + 24;
          		listTop = top;
          		modelY = top;
          		modelH = 172;

          		// Заголовок — неактивная кнопка (лейбл без своей отрисовки текста).
          		addLabel(left, titleY, total, 20, this.title.getString());

          		// Подпись под моделькой.
          		modelLabel = addLabel(modelX, top + 176, modelW, 20, "");

          		// Список: поиск, строки, переключатель страниц.
          		EditBox searchBox = new EditBox(this.font, listX, top, listW, 18, Component.literal("Поиск"));
          		searchBox.setHint(Component.literal("Поиск моба..."));
          		searchBox.setMaxLength(32);
          		searchBox.setValue(filter);
          		searchBox.setResponder(s -> {
          			filter = s;
          			page = 0;
          			rebuildList();
          		});
          		this.addRenderableWidget(searchBox);

          		int pagerY = top + 176;
          		this.addRenderableWidget(Button.builder(Component.literal("<"), b -> changePage(-1))
          				.bounds(listX, pagerY, 24, 20).build());
          		pageLabel = addLabel(listX + 26, pagerY, listW - 52, 20, "");
          		this.addRenderableWidget(Button.builder(Component.literal(">"), b -> changePage(1))
          				.bounds(listX + listW - 24, pagerY, 24, 20).build());

          		// Параметры. Любое изменение сразу отражается на моделке.
          		int hw = (paramW - 4) / 2;
          		int x2 = paramX + hw + 4;

          		EditBox nameBox = new EditBox(this.font, paramX, top, paramW, 20, Component.literal("Имя"));
          		nameBox.setHint(Component.literal("Имя моба (необязательно)"));
          		nameBox.setMaxLength(40);
          		nameBox.setValue(props.name);
          		nameBox.setResponder(s -> {
          			props.name = s;
          			refreshLabel();
          		});
          		this.addRenderableWidget(nameBox);

          		if (paramPage == 0) {
          			addNumber(paramX, top + 24, hw, "Кол-во", String.valueOf(spawnCount), "1", 4, s -> {
          				try {
          					spawnCount = Math.max(1, Math.min(MAX_COUNT, Integer.parseInt(s.trim())));
          				} catch (NumberFormatException ex) {
          					spawnCount = 1;
          				}
          			});
          			addCycle(x2, top + 24, hw, () -> "Размер: x" + fmt(props.scale),
          					() -> props.scale = Props.next(Props.SCALE, props.scale));
          			addNumber(paramX, top + 48, hw, "HP", props.hp < 0 ? "" : fmt(props.hp), "авто", 7, s -> {
          				try {
          					double v = Double.parseDouble(s.trim().replace(',', '.'));
          					props.hp = Double.isFinite(v) && v > 0 ? v : Props.AUTO;
          				} catch (NumberFormatException ex) {
          					props.hp = Props.AUTO;
          				}
          			});
          			addToggle(x2, top + 48, hw, "Малыш", () -> props.baby, v -> props.baby = v);
          			addToggle(paramX, top + 72, hw, "Без ИИ", () -> props.noAi, v -> props.noAi = v);
          			addToggle(x2, top + 72, hw, "Тихий", () -> props.silent, v -> props.silent = v);
          			addToggle(paramX, top + 96, hw, "Неуязвим", () -> props.invulnerable, v -> props.invulnerable = v);
          			addToggle(x2, top + 96, hw, "Свечение", () -> props.glowing, v -> props.glowing = v);
          			addToggle(paramX, top + 120, paramW, "Не исчезает", () -> props.persistent, v -> props.persistent = v);

          			boolean local = this.minecraft != null && this.minecraft.getSingleplayerServer() != null;
          			addLabel(paramX, top + 148, paramW, 18,
          					local ? "Права оператора не нужны" : "На сервере нужен оператор");
          		} else {
          			addCycle(paramX, top + 24, hw, () -> "Скорость: x" + fmt(props.speed),
          					() -> props.speed = Props.next(Props.SPEED, props.speed));
          			addCycle(x2, top + 24, hw, () -> props.damage < 0 ? "Урон: авто" : "Урон: " + fmt(props.damage),
          					() -> props.damage = Props.next(Props.DAMAGE, props.damage));
          			addCycle(paramX, top + 48, hw, () -> props.armor < 0 ? "Броня: авто" : "Броня: " + fmt(props.armor),
          					() -> props.armor = Props.next(Props.ARMOR, props.armor));
          			addCycle(x2, top + 48, hw, () -> props.knockback < 0 ? "Отброс: авто" : "Отброс: " + fmt(props.knockback),
          					() -> props.knockback = Props.next(Props.KNOCKBACK, props.knockback));
          			addToggle(paramX, top + 72, hw, "Невидим", () -> props.invisible, v -> props.invisible = v);
          			addToggle(x2, top + 72, hw, "Горит", () -> props.onFire, v -> props.onFire = v);
          			addToggle(paramX, top + 96, hw, "Без гравит.", () -> props.noGravity, v -> props.noGravity = v);
          			addToggle(x2, top + 96, hw, "Имя видно", () -> props.nameVisible, v -> props.nameVisible = v);
          			addCycle(paramX, top + 120, hw, () -> "Доспех: " + Props.GEAR_NAMES[props.gear],
          					() -> props.gear = (props.gear + 1) % Props.GEAR_NAMES.length);
          			addCycle(x2, top + 120, hw, () -> "Рука: " + Props.WEAPON_NAMES[props.weapon],
          					() -> props.weapon = (props.weapon + 1) % Props.WEAPON_NAMES.length);
          			addCycle(paramX, top + 144, paramW, () -> "Эффект: " + Props.EFFECT_NAMES[props.effect],
          					() -> props.effect = (props.effect + 1) % Props.EFFECT_NAMES.length);
          		}

          		this.addRenderableWidget(Button.builder(Component.literal("Заспавнить"), b -> {
          			spawn();
          			this.onClose();
          		}).bounds(paramX, top + 176, paramW, 20).build());

          		this.addRenderableWidget(Button.builder(
          				Component.literal(paramPage == 0 ? "Доп. параметры >" : "< Основные"), b -> {
          					paramPage = 1 - paramPage;
          					this.rebuildWidgets();
          				}).bounds(paramX, top + 198, hw, 20).build());
          		this.addRenderableWidget(Button.builder(Component.literal("Сброс"), b -> {
          			props.copyFrom(new Props());
          			spawnCount = 1;
          			this.rebuildWidgets();
          		}).bounds(x2, top + 198, hw, 20).build());

          		rebuildList();
          		updatePreview();
          	}

          	/** Подпись + поле, куда число вводится вручную. */
          	private void addNumber(int x, int y, int w, String label, String value, String hint, int maxLen,
          			java.util.function.Consumer<String> onChange) {
          		int lw = 42;
          		addLabel(x, y, lw, 20, label);
          		EditBox box = new EditBox(this.font, x + lw + 2, y, w - lw - 2, 20, Component.literal(label));
          		box.setMaxLength(maxLen);
          		box.setHint(Component.literal(hint));
          		box.setValue(value);
          		box.setResponder(onChange::accept);
          		this.addRenderableWidget(box);
          	}

          	private void rebuildList() {
          		for (Button b : listButtons) {
          			this.removeWidget(b);
          		}
          		listButtons.clear();
          		listShown.clear();

          		List<MobEntry> shown = filtered();
          		int pages = Math.max(1, (shown.size() + ROWS - 1) / ROWS);
          		page = Math.max(0, Math.min(page, pages - 1));

          		for (int i = 0; i < ROWS; i++) {
          			int idx = page * ROWS + i;
          			if (idx >= shown.size()) {
          				break;
          			}
          			MobEntry e = shown.get(idx);
          			Component label = e.id().equals(selectedId)
          					? Component.literal(e.label()).withStyle(ChatFormatting.YELLOW)
          					: Component.literal(e.label());
          			Button b = Button.builder(label, btn -> select(e))
          					.bounds(listX, listTop + 22 + i * 17, listW, 16).build();
          			this.addRenderableWidget(b);
          			listButtons.add(b);
          			listShown.add(e);
          		}

          		if (pageLabel != null) {
          			pageLabel.setMessage(Component.literal((page + 1) + " / " + pages + "  (" + shown.size() + ")"));
          		}
          	}

          	private void changePage(int delta) {
          		page += delta;
          		rebuildList();
          	}

          	private void select(MobEntry e) {
          		selectedId = e.id();
          		updatePreview();
          		rebuildList();
          	}

          	@Override
          	public void extractRenderState(GuiGraphicsExtractor graphics, int mouseX, int mouseY, float partialTick) {
          		super.extractRenderState(graphics, mouseX, mouseY, partialTick);

          		drawModelPanel(graphics);
          		graphics.nextStratum();

          		// Иконка слева в каждой строке списка.
          		for (int i = 0; i < listButtons.size(); i++) {
          			Button b = listButtons.get(i);
          			graphics.item(listShown.get(i).icon(), b.getX() + 2, b.getY());
          		}

          		drawModel(graphics, mouseX, mouseY);
          	}

          	// ------------------------------------------------------------ спавн

          	/** Спавнит мобов перед игроком: напрямую на встроенном сервере или через /summon на чужом. */
          	private void spawn() {
          		MobEntry e = current();
          		if (e == null || this.minecraft == null || this.minecraft.player == null) {
          			return;
          		}

          		Props p = props.copy();
          		int count = Math.max(1, Math.min(MAX_COUNT, spawnCount));
          		Random random = new Random();
          		double spread = count == 1 ? 0.0 : Math.min(8.0, 1.5 + Math.sqrt(count));

          		// Смещения «вперёд / вбок» от игрока для каждого моба.
          		double[] sides = new double[count];
          		double[] forwards = new double[count];
          		for (int i = 0; i < count; i++) {
          			sides[i] = (random.nextDouble() - 0.5) * 2.0 * spread;
          			forwards[i] = 3.0 + random.nextDouble() * spread;
          		}

          		MinecraftServer server = this.minecraft.getSingleplayerServer();
          		if (server != null) {
          			spawnLocal(server, this.minecraft.player.getUUID(), e.type(), p, sides, forwards);
          			return;
          		}

          		// Чужой сервер: только через команду, права оператора обязательны.
          		String nbt = p.toNbt(true);
          		for (int i = 0; i < count; i++) {
          			String pos = String.format(Locale.ROOT, "^%.2f ^ ^%.2f", sides[i], forwards[i]);
          			// rotated ~ 0: считаем «вперёд» по горизонтали, даже если игрок смотрит вниз или вверх.
          			SpawnGuiClient.queue("execute rotated ~ 0 run summon " + e.id() + " " + pos + " " + nbt);
          		}
          	}

          	/**
          	 * Убирает заспавненного модом моба, на которого смотрит игрок. Работает даже если моб неуязвим.
          	 * На чужом сервере (там нельзя точно навести) удаляется ближайший помеченный моб командой /kill.
          	 */
          	static void removeLookedAt(Minecraft mc) {
          		if (mc.player == null) {
          			return;
          		}
          		MinecraftServer server = mc.getSingleplayerServer();
          		if (server == null) {
          			SpawnGuiClient.queue("kill @n[tag=" + Props.TAG + "]");
          			return;
          		}

          		UUID playerId = mc.player.getUUID();
          		server.execute(() -> {
          			ServerPlayer player = server.getPlayerList().getPlayer(playerId);
          			if (player == null) {
          				return;
          			}
          			Entity best = Look.find(player, REMOVE_RANGE, x -> x.entityTags().contains(Props.TAG));
          			if (best != null) {
          				best.discard();
          			}
          		});
          	}

          	/** Создаёт мобов прямо в мире встроенного сервера — без команд и без прав оператора. */
          	private static void spawnLocal(MinecraftServer server, UUID playerId, EntityType<?> type, Props p,
          			double[] sides, double[] forwards) {
          		server.execute(() -> {
          			ServerPlayer player = server.getPlayerList().getPlayer(playerId);
          			if (player == null) {
          				return;
          			}
          			ServerLevel level = (ServerLevel) player.level();
          			double yaw = Math.toRadians(player.getYRot());
          			double fx = -Math.sin(yaw);
          			double fz = Math.cos(yaw);

          			for (int i = 0; i < sides.length; i++) {
          				Entity entity = type.create(level, EntitySpawnReason.COMMAND);
          				if (entity == null) {
          					continue;
          				}
          				double x = player.getX() + fx * forwards[i] + fz * sides[i];
          				double z = player.getZ() + fz * forwards[i] - fx * sides[i];
          				entity.setPos(x, player.getY(), z);
          				entity.setYRot(player.getYRot() + 180.0f);

          				if (entity instanceof Mob mob) {
          					mob.finalizeSpawn(level, level.getCurrentDifficultyAt(entity.blockPosition()),
          							EntitySpawnReason.COMMAND, null);
          				}
          				p.apply(entity, Props.Mode.SPAWN);
          				level.addFreshEntity(entity);
          			}
          		});
          	}
          }
          SPAWNGUI_EOF
          mkdir -p src/main/java/com/example/spawngui/client
          cat > src/main/java/com/example/spawngui/client/EditScreen.java <<'SPAWNGUI_EOF'
          package com.example.spawngui.client;

          import java.util.Locale;
          import java.util.UUID;
          import java.util.function.DoubleConsumer;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.gui.GuiGraphicsExtractor;
          import net.minecraft.client.gui.components.Button;
          import net.minecraft.client.gui.components.EditBox;
          import net.minecraft.network.chat.Component;
          import net.minecraft.server.MinecraftServer;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.server.level.ServerPlayer;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.entity.EquipmentSlot;
          import net.minecraft.world.entity.EntityType;
          import net.minecraft.world.entity.LivingEntity;
          import net.minecraft.world.entity.Mob;

          /**
           * Редактор характеристик существа: открывается клавишей меню, если смотреть на моба, присев (Shift).
           * Показывает текущие значения, даёт поменять их и применить. В одиночной игре и на LAN-хосте
           * изменения вносятся прямо в моба на встроенном сервере, на чужом сервере — через /data merge entity
           * (нужен оператор).
           */
          public class EditScreen extends PropsScreen {

          	private static final EquipmentSlot[] COPY_SLOTS = {
          			EquipmentSlot.HEAD, EquipmentSlot.CHEST, EquipmentSlot.LEGS, EquipmentSlot.FEET,
          			EquipmentSlot.MAINHAND, EquipmentSlot.OFFHAND};

          	/** Клиентская копия моба (по ней рисуется превью и берётся UUID). */
          	private final Entity target;
          	private final UUID targetId;

          	public EditScreen(Entity target) {
          		super(Component.literal("Характеристики"), Props.from(authoritative(target)));
          		this.target = target;
          		this.targetId = target.getUUID();
          	}

          	/** В одиночной игре читаем значения у настоящего моба на сервере — клиент знает не всё. */
          	private static Entity authoritative(Entity clientEntity) {
          		Minecraft mc = Minecraft.getInstance();
          		MinecraftServer server = mc.getSingleplayerServer();
          		if (server != null && mc.player != null) {
          			ServerPlayer sp = server.getPlayerList().getPlayer(mc.player.getUUID());
          			if (sp != null) {
          				Entity real = ((ServerLevel) sp.level()).getEntity(clientEntity.getUUID());
          				if (real != null) {
          					return real;
          				}
          			}
          		}
          		return clientEntity;
          	}

          	private String displayName() {
          		Component custom = target.getCustomName();
          		return custom != null ? custom.getString() : target.getType().getDescription().getString();
          	}

          	@Override
          	protected EntityType<?> previewType() {
          		return target.getType();
          	}

          	@Override
          	protected String previewLabel() {
          		String text = target.getType().getDescription().getString();
          		if (target instanceof LivingEntity living) {
          			text += "  " + String.format(Locale.ROOT, "%.1f", living.getHealth())
          					+ "/" + String.format(Locale.ROOT, "%.1f", living.getMaxHealth());
          		}
          		return text;
          	}

          	@Override
          	protected void prepare(LivingEntity preview) {
          		// Превью — новая копия того же типа, поэтому переносим экипировку настоящего моба.
          		if (target instanceof LivingEntity living) {
          			for (EquipmentSlot slot : COPY_SLOTS) {
          				preview.setItemSlot(slot, living.getItemBySlot(slot).copy());
          			}
          		}
          	}

          	// ------------------------------------------------------------ интерфейс

          	private static double parse(String s) {
          		try {
          			double v = Double.parseDouble(s.trim().replace(',', '.'));
          			return Double.isFinite(v) && v >= 0 ? v : Props.AUTO;
          		} catch (NumberFormatException ex) {
          			return Props.AUTO;
          		}
          	}

          	/** Строка «подпись + поле для числа». Пустое поле = «не менять». */
          	private void addNumber(int x, int y, int w, String label, double value, boolean enabled, DoubleConsumer set) {
          		int lw = 52;
          		addLabel(x, y, lw, 20, label);
          		EditBox box = new EditBox(this.font, x + lw + 2, y, w - lw - 2, 20, Component.literal(label));
          		box.setMaxLength(8);
          		box.setHint(Component.literal("авто"));
          		box.setValue(value < 0 ? "" : fmt(value));
          		box.setResponder(s -> {
          			set.accept(parse(s));
          			updatePreview();
          		});
          		box.active = enabled;
          		this.addRenderableWidget(box);
          	}

          	@Override
          	protected void init() {
          		boolean living = target instanceof LivingEntity;
          		boolean mob = target instanceof Mob;

          		int total = Math.min(this.width - 16, 480);
          		int left = (this.width - total) / 2;
          		int gap = 6;
          		modelW = total * 24 / 100;
          		modelX = left;
          		int sx = modelX + modelW + gap;
          		int sw = total - modelW - gap;
          		int col = (sw - 8) / 3;
          		int c0 = sx;
          		int c1 = sx + col + 4;
          		int c2 = sx + 2 * (col + 4);
          		int full = 3 * col + 8;

          		int titleY = Math.max(2, (this.height - 240) / 2);
          		int top = titleY + 24;
          		modelY = top;
          		modelH = 190;

          		addLabel(left, titleY, total, 20, "Характеристики: " + displayName());
          		modelLabel = addLabel(modelX, top + 196, modelW, 20, "");

          		// Имя.
          		EditBox nameBox = new EditBox(this.font, sx, top, full, 20, Component.literal("Имя"));
          		nameBox.setHint(Component.literal("Имя (пусто — без имени)"));
          		nameBox.setMaxLength(40);
          		nameBox.setValue(props.name);
          		nameBox.setResponder(s -> props.name = s);
          		this.addRenderableWidget(nameBox);

          		// Числа.
          		addNumber(c0, top + 24, col, "HP", props.hp, living, v -> props.hp = v);
          		addNumber(c1, top + 24, col, "Размер", props.scale, living, v -> props.scale = v < 0 ? 1.0 : v);
          		addNumber(c2, top + 24, col, "Скорость", props.speed, living, v -> props.speed = v < 0 ? 1.0 : v);
          		addNumber(c0, top + 48, col, "Урон", props.damage, living, v -> props.damage = v);
          		addNumber(c1, top + 48, col, "Броня", props.armor, living, v -> props.armor = v);
          		addNumber(c2, top + 48, col, "Устойч.", props.knockback, living, v -> props.knockback = v);

          		// Флаги.
          		Button baby = addToggle(c0, top + 72, col, "Малыш", () -> props.baby, v -> props.baby = v);
          		Button noAi = addToggle(c1, top + 72, col, "Без ИИ", () -> props.noAi, v -> props.noAi = v);
          		addToggle(c2, top + 72, col, "Тихий", () -> props.silent, v -> props.silent = v);
          		addToggle(c0, top + 96, col, "Неуязвим", () -> props.invulnerable, v -> props.invulnerable = v);
          		addToggle(c1, top + 96, col, "Свечение", () -> props.glowing, v -> props.glowing = v);
          		addToggle(c2, top + 96, col, "Невидим", () -> props.invisible, v -> props.invisible = v);
          		addToggle(c0, top + 120, col, "Горит", () -> props.onFire, v -> props.onFire = v);
          		addToggle(c1, top + 120, col, "Без гравит.", () -> props.noGravity, v -> props.noGravity = v);
          		addToggle(c2, top + 120, col, "Имя видно", () -> props.nameVisible, v -> props.nameVisible = v);
          		Button persistent = addToggle(c0, top + 144, col, "Не исчезает", () -> props.persistent, v -> props.persistent = v);
          		Button gear = addCycle(c1, top + 144, col, () -> "Доспех: " + Props.GEAR_NAMES[props.gear],
          				() -> props.gear = (props.gear + 1) % Props.GEAR_NAMES.length);
          		Button hand = addCycle(c2, top + 144, col, () -> "Рука: " + Props.WEAPON_NAMES[props.weapon],
          				() -> props.weapon = (props.weapon + 1) % Props.WEAPON_NAMES.length);
          		Button effect = addCycle(c0, top + 168, full, () -> "Эффект: " + Props.EFFECT_NAMES[props.effect],
          				() -> props.effect = (props.effect + 1) % Props.EFFECT_NAMES.length);

          		baby.active = mob;
          		noAi.active = mob;
          		persistent.active = mob;
          		gear.active = living;
          		hand.active = living;
          		effect.active = living;

          		// Действия.
          		this.addRenderableWidget(Button.builder(Component.literal("Применить"), b -> {
          			apply();
          			this.onClose();
          		}).bounds(c0, top + 196, col, 20).build());
          		this.addRenderableWidget(Button.builder(Component.literal("Убрать моба"), b -> {
          			remove();
          			this.onClose();
          		}).bounds(c1, top + 196, col, 20).build());
          		this.addRenderableWidget(Button.builder(Component.literal("Закрыть"), b -> this.onClose())
          				.bounds(c2, top + 196, col, 20).build());

          		updatePreview();
          	}

          	@Override
          	public void extractRenderState(GuiGraphicsExtractor graphics, int mouseX, int mouseY, float partialTick) {
          		super.extractRenderState(graphics, mouseX, mouseY, partialTick);
          		drawModelPanel(graphics);
          		graphics.nextStratum();
          		drawModel(graphics, mouseX, mouseY);
          	}

          	// ------------------------------------------------------------ действия

          	/** Применяет настройки к настоящему мобу: напрямую на встроенном сервере или командой на чужом. */
          	private void apply() {
          		if (this.minecraft == null || this.minecraft.player == null) {
          			return;
          		}
          		Props p = props.copy();
          		MinecraftServer server = this.minecraft.getSingleplayerServer();
          		if (server != null) {
          			UUID playerId = this.minecraft.player.getUUID();
          			server.execute(() -> {
          				Entity real = findOnServer(server, playerId);
          				if (real != null) {
          					p.apply(real, Props.Mode.EDIT);
          				}
          			});
          			return;
          		}
          		SpawnGuiClient.queue("data merge entity " + targetId + " " + p.toNbt(false));
          	}

          	private void remove() {
          		if (this.minecraft == null || this.minecraft.player == null) {
          			return;
          		}
          		MinecraftServer server = this.minecraft.getSingleplayerServer();
          		if (server != null) {
          			UUID playerId = this.minecraft.player.getUUID();
          			server.execute(() -> {
          				Entity real = findOnServer(server, playerId);
          				if (real != null) {
          					real.discard();
          				}
          			});
          			return;
          		}
          		SpawnGuiClient.queue("kill " + targetId);
          	}

          	private Entity findOnServer(MinecraftServer server, UUID playerId) {
          		ServerPlayer player = server.getPlayerList().getPlayer(playerId);
          		if (player == null) {
          			return null;
          		}
          		return ((ServerLevel) player.level()).getEntity(targetId);
          	}
          }
          SPAWNGUI_EOF

