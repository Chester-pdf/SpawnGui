          package com.example.spawngui.client;

          import java.util.function.Predicate;
          import net.minecraft.world.entity.Entity;
          import net.minecraft.world.level.Level;
          import net.minecraft.world.phys.AABB;
          import net.minecraft.world.phys.Vec3;

          /** Поиск сущности, на которую смотрит игрок (работает и на клиенте, и на сервере). */
          final class Look {
          	private Look() {}

          	static Entity find(Entity viewer, double range, Predicate<Entity> filter) {
          		Level level = viewer.level();
          		Vec3 from = viewer.getEyePosition();
          		Vec3 to = from.add(viewer.getViewVector(1.0f).scale(range));
          		AABB area = viewer.getBoundingBox().expandTowards(to.subtract(from)).inflate(1.0);

          		Entity best = null;
          		double bestDist = Double.MAX_VALUE;
          		for (Entity entity : level.getEntities(viewer, area, filter)) {
          			AABB box = entity.getBoundingBox().inflate(0.15);
          			double dist;
          			if (box.contains(from)) {
          				dist = 0.0;
          			} else {
          				var hit = box.clip(from, to);
          				if (hit.isEmpty()) {
          					continue;
          				}
          				dist = from.distanceToSqr(hit.get());
          			}
          			if (dist < bestDist) {
          				bestDist = dist;
          				best = entity;
          			}
          		}
          		return best;
          	}
          }
